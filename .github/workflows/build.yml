name: Сборка

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Версия
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
            IFS=. read -r MAJ MIN PAT <<< "$NAME"
            CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          else
            NAME="0.0.${GITHUB_RUN_NUMBER}-dev"
            CODE=1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Тесты и отладочная сборка
        run: |
          gradle --no-daemon --stacktrace :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }} \
            2>&1 | tee -a build.log

      - name: Отладочный APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/debug/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 5

      - name: Ключ подписи
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Не заданы секреты SIGNING_KEYSTORE_BASE64 и SIGNING_KEYSTORE_PASSWORD" | tee -a build.log
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Подписанный APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease \
            -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }} \
            2>&1 | tee -a build.log
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/raspisanie-neti-v${{ steps.ver.outputs.name }}.apk"
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Описание релиза
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v ver="v${{ steps.ver.outputs.name }}" '
            /^## / { on = ($2 == ver) ; next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Изменения не описаны." > release-notes.md; fi
          cat release-notes.md

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Расписание НЭТИ ${{ steps.ver.outputs.name }}
          body_path: release-notes.md
          files: dist/*.apk

      # Короткий отчёт о сборке в служебную ветку ci-logs (одна перезаписываемая
      # версия): ошибки компиляции, упавшие тесты и картинки стилей виджета.
      - name: Отчёт в ветку ci-logs
        if: always()
        run: |
          R="$RUNNER_TEMP/report"
          mkdir -p "$R"
          {
            echo "sha: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "status: ${{ job.status }}"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$R/status.txt"
          if [ -f build.log ]; then
            grep -E '^e: |^w: .*deprecated|error:|FAILED|What went wrong|^> |BUILD |Exception|Error|expected|at io\.github' build.log | head -400 > "$R/errors.txt" || true
            tail -n 300 build.log > "$R/tail.txt"
          fi
          if [ -d app/build/screenshots ]; then cp -r app/build/screenshots "$R/screenshots"; fi
          cd "$R"
          git init -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI #$GITHUB_RUN_NUMBER $GITHUB_SHA"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
